<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="90%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF9C3" />
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Ring Shadow & Gold Rim -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldBorder)" stroke-width="7" filter="url(#subtleShadow)" />
  <circle cx="100" cy="100" r="90.5" fill="none" stroke="#78350F" stroke-width="0.8" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="url(#innerGlow)" />

  <!-- Center Artwork: Stylized "Raj" with Islamic motifs -->
  <g transform="translate(10, 5)">
    <!-- Minaret Spire above the red J -->
    <path d="M 119 46 L 123 38 L 127 46 Z" fill="#DC2626" />
    <circle cx="123" cy="35" r="2.5" fill="#EAB308" />
    <rect x="121" y="46" width="4" height="8" fill="#DC2626" />
    <path d="M 118 54 Q 123 51 128 54 L 127 58 L 119 58 Z" fill="#EAB308" />

    <!-- Minaret / Dome above the green R/a connection -->
    <path d="M 112 70 C 112 60 118 56 118 56 C 118 56 124 60 124 70 Z" fill="#047857" />
    <circle cx="118" cy="53" r="1.5" fill="#EAB308" />

    <!-- Green "R" -->
    <path d="M 46 62 L 66 62 C 78 62 84 68 84 76 C 84 83 78 87 70 89 L 85 116 L 73 116 L 60 91 L 56 91 L 56 116 L 46 116 Z M 56 71 L 56 83 L 65 83 C 71 83 74 80 74 77 C 74 73 71 71 65 71 Z" fill="#047857" />

    <!-- Green "a" -->
    <path d="M 88 88 C 88 80 94 75 103 75 C 111 75 116 80 116 87 L 116 116 L 107 116 L 107 110 C 104 114 99 117 93 117 C 85 117 80 112 80 104 C 80 96 87 91 97 91 L 107 91 L 107 87 C 107 83 104 81 100 81 C 96 81 93 83 91 86 Z M 107 99 L 98 99 C 93 99 90 101 90 104 C 90 108 93 110 97 110 C 102 110 107 106 107 101 Z" fill="#047857" />

    <!-- Red "j" Swooping down -->
    <path d="M 119 58 L 127 58 L 127 105 C 127 116 122 124 110 124 C 102 124 96 120 94 115 L 102 110 C 104 113 107 115 111 115 C 116 115 118 111 118 105 Z" fill="#DC2626" />
  </g>

  <!-- Banner Ribbon with "TARIQAH AL-RAJ" -->
  <g transform="translate(100, 142)">
    <!-- Banner Path -->
    <path d="M -60 0 L 60 0 C 64 0 66 3 65 6 L 60 16 C 59 19 56 20 52 20 L -52 20 C -56 20 -59 19 -60 16 L -65 6 C -66 3 -64 0 -60 0 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.2" filter="url(#subtleShadow)" />
    <!-- Small Ribbon Ends -->
    <path d="M -60 0 L -68 -5 L -65 6 Z" fill="#B45309" />
    <path d="M 60 0 L 68 -5 L 65 6 Z" fill="#B45309" />
    <!-- Text -->
    <text x="0" y="14" font-family="Inter, sans-serif" font-weight="900" font-size="8.5" fill="#DC2626" text-anchor="middle" letter-spacing="1">TARIQAH AL-RAJ</text>
  </g>
</svg>
